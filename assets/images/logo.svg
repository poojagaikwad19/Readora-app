<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth drop shadow matching the subtle blur effect -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6C47FF" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Rectangle -->
  <rect 
    x="56" 
    y="56" 
    width="400" 
    height="400" 
    rx="105" 
    ry="105" 
    fill="#6242ED" 
    filter="url(#glow-shadow)" 
  />

  <!-- White Open Book Icon -->
  <g 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="26" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Left Page Outline -->
    <path d="M 256, 310 
             C 215, 292 180, 292 150, 305 
             L 150, 206 
             C 180, 193 215, 193 256, 211 
             Z" />

    <!-- Right Page Outline -->
    <path d="M 256, 310 
             C 297, 292 332, 292 362, 305 
             L 362, 206 
             C 332, 193 297, 193 256, 211 
             Z" />
  </g>
</svg>
